name: リリース

# 手動実行のみ。バージョンの指定方法は2通り:
#   1. 新規作成 - ブランチを選び、下の「バージョン」に入力する（タグは自動で作成される）
#   2. 既存を選択 - 「Use workflow from」で既存タグを選び、「バージョン」は空のままにする
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（例: 1.0.0）。空にすると選択中のタグを使います'
        required: false
        type: string
      prerelease:
        description: 'プレリリースとして公開する'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags must be present so an existing one can be reused instead of recreated.
          fetch-depth: 0

      - name: バージョンの決定
        id: v
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = "$env:INPUT_VERSION".Trim() -replace '^v', ''
          if (-not $version) {
            if ($env:REF_TYPE -ne 'tag') {
              throw "バージョンが指定されていません。バージョンを入力するか、「Use workflow from」でタグを選んで再実行してください。"
            }
            $version = $env:REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "バージョンは 1.0.0 の形式で指定してください（入力値: '$version'）。"
          }

          $tag = "v$version"
          "version=$version"                  >> $env:GITHUB_OUTPUT
          "tag=$tag"                          >> $env:GITHUB_OUTPUT
          "name=AmazonMusicSmtc-$tag"         >> $env:GITHUB_OUTPUT
          Write-Host "$tag を AmazonMusicSmtc-$tag.msix としてリリースします"

      - name: 既存リリースの確認
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.v.outputs.tag }}' --json tagName 1>$null 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          # A miss is the expected case; leaving gh's exit code in place would fail the step.
          $LASTEXITCODE = 0
          if ($exists) {
            throw "リリース ${{ steps.v.outputs.tag }} は既に存在します。バージョンを上げるか、既存のリリースを削除してください。"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: ビルドとパッケージング
        shell: pwsh
        env:
          # Optional. Without them the script mints a throwaway self-signed cert,
          # which means users must trust a different certificate for every release.
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $params = @{
            Version    = '${{ steps.v.outputs.version }}'
            OutputName = '${{ steps.v.outputs.name }}'
          }
          $pfx = $null
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $params.PfxPath      = $pfx
            $params.CertPassword = $env:SIGNING_PFX_PASSWORD
          } else {
            Write-Warning "署名用の Secrets が未設定です。使い捨ての自己署名証明書で署名します。"
          }
          try {
            ./tools/pack-release.ps1 @params
          }
          finally {
            if ($pfx -and (Test-Path $pfx)) { Remove-Item $pfx -Force }
          }

      - name: リリースノートの作成
        shell: pwsh
        run: |
          # Literal here-string: nothing in the markdown gets interpreted by PowerShell.
          $notes = @'
          ## インストール

          下の `{NAME}.msix` と `{NAME}.cer` を **両方** ダウンロードしてください。

          1. 証明書を信頼する（管理者 PowerShell、初回のみ）

             ```powershell
             Import-Certificate -FilePath .\{NAME}.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
             ```

          2. パッケージをインストールする

             ```powershell
             Add-AppxPackage .\{NAME}.msix
             ```

          詳細は README を参照してください。
          '@
          $notes.Replace('{NAME}', '${{ steps.v.outputs.name }}') |
            Set-Content release-notes.md -Encoding utf8

      - name: タグの作成
        shell: pwsh
        run: |
          $tag = '${{ steps.v.outputs.tag }}'
          if (git tag --list $tag) {
            Write-Host "タグ $tag は既に存在するため、そのまま使用します"
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: リリースの公開
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = '${{ steps.v.outputs.name }}'
          $argv = @(
            'release', 'create', '${{ steps.v.outputs.tag }}',
            "build/release/$name.msix",
            "build/release/$name.cer",
            '--title',      '${{ steps.v.outputs.tag }}',
            '--notes-file', 'release-notes.md',
            # Install steps first, auto-generated changelog appended underneath.
            '--generate-notes'
          )
          if ('${{ inputs.prerelease }}' -eq 'true') { $argv += '--prerelease' }
          gh @argv
          if ($LASTEXITCODE -ne 0) { throw "gh release create に失敗しました（終了コード $LASTEXITCODE）" }
