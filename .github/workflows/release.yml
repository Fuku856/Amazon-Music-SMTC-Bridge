name: Release

# Manual runs only. There are two ways to specify the version:
#   1. Create new - choose a branch and enter the version below (the tag is created automatically)
#   2. Select existing - choose an existing tag under "Use workflow from" and leave "Version" empty
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0 / 1.0.0 / v1.2.0-beta1)'
        required: false
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags must be present so an existing one can be reused instead of recreated.
          fetch-depth: 0

      - name: Determine version
        id: v
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # The tag is always v-prefixed, so both "v1.0.0" and "1.0.0" are accepted
          # and normalised to the same thing.
          $raw     = "$env:INPUT_VERSION".Trim()
          $version = $raw -replace '^v', ''
          if (-not $version) {
            if ($env:REF_TYPE -ne 'tag') {
              throw 'No version specified. Enter a version, or select a tag under "Use workflow from" and run again.'
            }
            $raw     = $env:REF_NAME
            $version = $raw -replace '^v', ''
          }
          # A SemVer pre-release suffix is allowed on the tag but cannot reach the
          # package: MSIX Identity/Version is four numeric parts and nothing else.
          $m = [regex]::Match($version, '^(?<base>\d+\.\d+\.\d+)(?:-(?<pre>[0-9A-Za-z.]+))?$')
          if (-not $m.Success) {
            throw "Specify the version as v1.0.0 / 1.0.0, or v1.2.0-beta1 for a pre-release (input: '$raw')."
          }
          $base = $m.Groups['base'].Value
          $pre  = $m.Groups['pre'].Value

          # The whole identifier has to survive the trip into a single number, series
          # included. Encoding only the trailing number would map alpha1 and beta1 to
          # the same package version, and installing the second over the first fails
          # with 0x80073CFB - which install.cmd cannot retry past, so the user would
          # have to uninstall and lose their settings. A decade block per series
          # keeps them apart and keeps them in order.
          $series = [ordered]@{ alpha = 1; beta = 2; rc = 3 }

          if ($pre) {
            $p = [regex]::Match($pre, '^(?<series>[A-Za-z]+)(?<number>\d+)$')
            if (-not $p.Success) {
              throw "The pre-release identifier must be letters followed by a number (e.g. v$base-beta1). Input: '$raw'"
            }
            $rank = $series[$p.Groups['series'].Value.ToLower()]
            if (-not $rank) {
              throw "Allowed pre-release identifiers are $($series.Keys -join ' / ') (e.g. v$base-beta1). Input: '$raw'"
            }
            $number = [int]$p.Groups['number'].Value
            if ($number -lt 1 -or $number -gt 9999) {
              throw "The pre-release number must be between 1 and 9999 (input: '$raw')."
            }
            # alpha1 -> 10001, beta1 -> 20001, rc1 -> 30001. Well inside the 65535
            # a revision field holds, and ordered the way the series are.
            $revision = $rank * 10000 + $number
            $tag = "v$base-$pre"
          }
          else {
            # Reserved for the final release, which therefore sorts *below* its own
            # betas. install.cmd retries with -ForceUpdateFromAnyVersion, so that
            # downgrade is handled; a manual Add-AppxPackage needs the switch itself.
            $revision = 0
            $tag = "v$base"
          }

          # A pre-release tag is published as a pre-release whatever the checkbox says.
          $prerelease = $pre -or $env:INPUT_PRERELEASE -eq 'true'

          "version=$base.$revision"                        >> $env:GITHUB_OUTPUT
          "tag=$tag"                                       >> $env:GITHUB_OUTPUT
          "name=AmazonMusic-SMTC-Bridge_$tag"              >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag as AmazonMusic-SMTC-Bridge_$tag.msix (package version $base.$revision)"

      - name: Check existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.v.outputs.tag }}' --json tagName 1>$null 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          # A miss is the expected case; leaving gh's exit code in place would fail the step.
          $LASTEXITCODE = 0
          if ($exists) {
            throw "Release ${{ steps.v.outputs.tag }} already exists. Bump the version or delete the existing release."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package
        shell: pwsh
        env:
          # Optional. Without them the script mints a throwaway self-signed cert,
          # which means users must trust a different certificate for every release.
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # Asset URLs are deterministic, so the installer can point at a package
          # that this run has not uploaded yet.
          $name = '${{ steps.v.outputs.name }}'
          $params = @{
            Version     = '${{ steps.v.outputs.version }}'
            OutputName  = $name
            DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/$name.msix"
          }
          $pfx = $null
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $params.PfxPath      = $pfx
            $params.CertPassword = $env:SIGNING_PFX_PASSWORD
          } else {
            Write-Warning "Signing secrets are not configured. Signing with a throwaway self-signed certificate."
          }
          try {
            ./tools/pack-release.ps1 @params
          }
          finally {
            if ($pfx -and (Test-Path $pfx)) { Remove-Item $pfx -Force }
          }

      - name: Create release notes
        shell: pwsh
        run: |
          # Literal here-string: nothing in the markdown gets interpreted by PowerShell.
          $notes = @'
          ## Installation

          Download **only `{NAME}_install.cmd`** and double-click it. It downloads the package, trusts the certificate, and installs the app in sequence (one administrator confirmation appears along the way).

          The installer is in English by default and switches to Japanese automatically on Japanese Windows. You can force a language with `-Lang ja` or `-Lang en`.

          The `.msix` and `.cer` are only needed for manual installation.

          <details>
          <summary>Manual installation</summary>

          1. Trust the certificate (administrator PowerShell, first time only)

             ```powershell
             Import-Certificate -FilePath .\{NAME}.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
             ```

          2. Install the package (normal PowerShell)

             ```powershell
             Add-AppxPackage .\{NAME}.msix
             ```

          Double-clicking the `.cer` only imports the certificate into the current user's store and results in `0x800B0109` during installation. Always use the commands above (or choose "Local Machine" → "Trusted Publishers" in the wizard).
          </details>

          See the README for details.
          '@
          $notes.Replace('{NAME}', '${{ steps.v.outputs.name }}') |
            Set-Content release-notes.md -Encoding utf8

      - name: Create tag
        shell: pwsh
        run: |
          $tag = '${{ steps.v.outputs.tag }}'
          if (git tag --list $tag) {
            Write-Host "Tag $tag already exists; using it as is"
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = '${{ steps.v.outputs.name }}'
          $argv = @(
            'release', 'create', '${{ steps.v.outputs.tag }}',
            "build/release/$name.msix",
            "build/release/$name.cer",
            "build/release/${name}_install.cmd",
            '--title',      '${{ steps.v.outputs.tag }}',
            '--notes-file', 'release-notes.md',
            # Install steps first, auto-generated changelog appended underneath.
            '--generate-notes'
          )
          if ('${{ steps.v.outputs.prerelease }}' -eq 'true') { $argv += '--prerelease' }
          gh @argv
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit code $LASTEXITCODE)" }
